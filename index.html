<script>
/* ============================================================
   家計簿 入力画面
   ============================================================ */
function entryStoreHints(){
  const m={};
  (S.entries||[]).forEach(e=>{ const s=(e.store||"").trim(); if(s) m[s]=(m[s]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
function entryItemHints(){
  const m={};
  (S.entries||[]).forEach(e=>{ const v=(e.item!=null?String(e.item):String(e.memo||"")).trim(); if(v) m[v]=(m[v]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
/* 店文脈つき品目ヒント: 店名があれば「その店(チェーン単位)で過去に買った品目」だけを頻度順で。
   未知の店なら空(的外れな全体人気を出さない)。店名が空なら従来の全体人気順。 */
function chainKeyOf(n){ const t=String(n||"").trim(); const m=t.split(/[\s\u3000]+/).filter(Boolean); return m.length>1 ? m[0] : t; }
function entryItemHintsFor(store){
  const st=String(store||"").trim();
  if(!st) return entryItemHints();
  const target=chainKeyOf(st);
  const m={};
  (S.entries||[]).forEach(e=>{
    const es=(e.store||"").trim(); if(!es) return;
    if(chainKeyOf(es)!==target) return;
    const v=(e.item!=null?String(e.item):String(e.memo||"")).trim(); if(v) m[v]=(m[v]||0)+1;
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
}
/* v3.55: 「よく使う」を店名→品目→金額のカスケードへ再構成(旧entryUsualChipsの合体チップは文字の壁で使用困難だった)。
   v3.30の資産(経路品目の逆方向自動生成・履歴金額)はここへ移植して継承。連携srcは全て除外(幽霊エントリ防止) */
const CHIP_SRC_OK = e => e.src!=="slot" && e.src!=="mahjong" && e.src!=="fixed" && e.src!=="daida";
function chipItemOf(e){ return (e.item!=null?String(e.item):String(e.memo||"")).trim(); }
function entryChipStores(type){
  const m={};
  (S.entries||[]).filter(e=>e.type===type && CHIP_SRC_OK(e)).forEach(e=>{
    const s=(e.store||"").trim(); if(s) m[s]=(m[s]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,12);
}
function entryChipItems(type, store){
  const target=chainKeyOf(store), m={};
  (S.entries||[]).filter(e=>e.type===type && CHIP_SRC_OK(e)).forEach(e=>{
    const es=(e.store||"").trim(); if(!es||chainKeyOf(es)!==target) return;
    const v=chipItemOf(e); if(v) m[v]=(m[v]||0)+1; });
  const out=Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  /* 経路品目「A→B」の逆方向を自動生成(v3.30から継承・履歴に既在なら生成しない) */
  const have=new Set(out);
  out.slice().forEach(it=>{
    if(out.length>=8) return;
    const mm=/^(.+?)→(.+)$/.exec(it); if(!mm) return;
    const rev=mm[2].trim()+"→"+mm[1].trim();
    if(have.has(rev)) return;
    out.push(rev); have.add(rev);
  });
  return out.slice(0,6);
}
function entryChipAmounts(type, store, item){
  const target=chainKeyOf(store);
  const pick=(it)=>{
    if(!it) return [];
    const m={};
    (S.entries||[]).filter(e=>e.type===type && CHIP_SRC_OK(e)).forEach(e=>{
      const es=(e.store||"").trim(); if(!es||chainKeyOf(es)!==target) return;
      if(chipItemOf(e)!==it) return;
      const a=num(e.amount); if(a>0) m[a]=(m[a]||0)+1; });
    return Object.entries(m).sort((a,b)=>b[1]-a[1]||num(b[0])-num(a[0])).map(x=>num(x[0]));
  };
  const it=String(item||"").trim();
  let r=pick(it);
  /* 自動生成した逆方向経路は履歴が無いので往路の金額を流用(運賃同額前提・v3.30の思想) */
  if(!r.length){ const mm=/^(.+?)→(.+)$/.exec(it); if(mm) r=pick(mm[2].trim()+"→"+mm[1].trim()); }
  return r.slice(0,4);
}
function entryChipCat(type, store, item){
  const target=chainKeyOf(store), it=(item==null?null:String(item).trim()), m={};
  (S.entries||[]).filter(e=>e.type===type && CHIP_SRC_OK(e)).forEach(e=>{
    const es=(e.store||"").trim(); if(!es||chainKeyOf(es)!==target) return;
    if(it!==null && chipItemOf(e)!==it) return;
    if(e.category) m[e.category]=(m[e.category]||0)+1; });
  const top=Object.entries(m).sort((a,b)=>b[1]-a[1])[0];
  return top?top[0]:null;
}
/* v3.31: 交通の予想入力辞書。同一店名(モード)の過去品目を→で分解した駅・停トークンを頻度順で返す。
   駐輪は過去の場所(店名)辞書。datalistでなくタップチップで出す(iOSのdatalist UXが弱いため) */
function transTokens(mode){
  const m={};
  (S.entries||[]).forEach(e=>{
    if(e.type!=="expense") return;
    if(mode==="駐輪"){
      if(String(e.item||"").trim()==="駐輪"){ const s=(e.store||"").trim(); if(s) m[s]=(m[s]||0)+1; }
    } else {
      if((e.store||"").trim()!==mode) return;
      const mm=/^(.+?)→(.+)$/.exec(String(e.item||"")); if(!mm) return;
      [mm[1].trim(), mm[2].trim()].forEach(t=>{ if(t) m[t]=(m[t]||0)+1; });
    }
  });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,8);
}
function entryDetailHtml(e){
  const st=(e.store!=null?String(e.store):"").trim();
  const it=(e.item!=null?String(e.item):"").trim();
  if(st && it)
    return '<div class="muted ellip" style="font-size:11px">'+esc(it)+'</div>'+
           '<div class="ellip" style="font-size:11px;color:var(--muted);opacity:.7;margin-top:1px">'+esc(st)+'</div>';
  if(it) return '<div class="muted ellip" style="font-size:11px">'+esc(it)+'</div>';
  if(st) return '<div class="muted ellip" style="font-size:11px">'+esc(st)+'</div>';
  if(e.memo) return '<div class="muted ellip" style="font-size:11px">'+esc(e.memo)+'</div>';
  return '';
}
function viewEntry(){
  const f = UI.entryForm;
  const sh = entryStoreHints(), ih = entryItemHints();
  /* v3.55: 段階的開示のカスケード。店を選ぶまで品目は出さず、品目を選ぶまで金額は出さない */
  const cStores = entryChipStores(f.type);
  const curStore = (f.store||"").trim(), curItem = (f.item||"").trim();
  const chipRow = (label, arr, act, cur, extra) => (arr.length||extra)
    ? (label?'<div class="muted" style="font-size:11px;margin:0 2px 6px">'+label+'</div>':'')+
      '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:10px">'+
      arr.map(v=>'<button class="chip '+(String(cur)===String(v)?"sel":"")+'" data-a="'+act+'" data-v="'+esc(String(v))+'">'+
        (act==="uamt"?"¥"+num(v).toLocaleString("ja-JP"):esc(String(v)))+'</button>').join("")+(extra||'')+'</div>'
    : '';
  /* v3.57: チップは対応する入力欄の直下に置く(交通コンポーザと同じ対構造)。
     店は既定5件+展開トグル(UI.chipMore)。交通モード中はfieldsHtml自体が使われないので自動的に非表示になる */
  const moreChip = cStores.length>5
    ? '<button class="chip" style="color:var(--muted)" data-a="cmore">'+(UI.chipMore?"▾ 閉じる":"＋他"+(cStores.length-5)+"件")+'</button>' : '';
  const storeChips = chipRow("", (UI.chipMore?cStores:cStores.slice(0,5)), "ustore", curStore, moreChip);
  const itemChips  = curStore ? chipRow("", entryChipItems(f.type, curStore), "uitem", curItem) : '';
  const amtChips   = (curStore && curItem) ? chipRow("金額", entryChipAmounts(f.type, curStore, curItem), "uamt", num(f.amount)||"") : '';
  /* v3.31: 交通コンポーザ(新規支出のみ)。分類は増やさず保存時に 店名=モード/場所・品目=乗車→降車・分類=消費 へ合成する入力支援レイヤー。
     表記規約(店名固定・A→B)を規律でなく構造で強制する関所。編集画面は素の店名/品目に戻る一方通行 */
  const TRANS_MODES=["地下鉄","バス","電車","駐輪"];
  let transHtml="", composerHtml="";
  if(f.type==="expense" && UI.editEntryId===null){
    transHtml='<div class="muted" style="font-size:11px;margin:0 2px 6px">交通で記帳</div>'+
      '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:12px">'+
      TRANS_MODES.map(mo=>'<button class="chip '+(f.tmode===mo?"sel":"")+'" data-a="tmode" data-v="'+mo+'">'+mo+'</button>').join("")+'</div>';
    if(f.tmode){
      const toks=transTokens(f.tmode);
      const tokRow=act=> toks.length
        ? '<div class="row" style="flex-wrap:wrap;gap:6px;margin:0 0 10px">'+
          toks.map(t=>'<button class="chip" data-a="'+act+'" data-v="'+esc(t)+'">'+esc(t)+'</button>').join("")+'</div>'
        : '';
      if(f.tmode==="駐輪"){
        composerHtml='<input class="input" id="t-place" placeholder="場所(例: ヨドバシP2)" value="'+esc(f.tplace||"")+'" autocomplete="off" style="margin-bottom:8px">'+tokRow("tkp");
      } else {
        composerHtml='<input class="input" id="t-from" placeholder="乗車駅・停" value="'+esc(f.tfrom||"")+'" autocomplete="off" style="margin-bottom:8px">'+tokRow("tkf")+
          '<input class="input" id="t-to" placeholder="降車駅・停" value="'+esc(f.tto||"")+'" autocomplete="off" style="margin-bottom:8px">'+tokRow("tkt");
      }
      composerHtml+='<div class="muted" style="font-size:10px;margin:0 2px 14px">保存時: 店名='+(f.tmode==="駐輪"?"場所":esc(f.tmode))+' / 品目='+(f.tmode==="駐輪"?"駐輪":"乗車→降車")+' / 分類=消費</div>';
    }
  }
  const fieldsHtml = '<input class="input" id="e-store" list="e-storelist" placeholder="店名(任意)" value="'+esc(f.store||"")+'" autocomplete="off" style="margin-bottom:'+(storeChips?"6":"8")+'px">'+
    '<datalist id="e-storelist">'+sh.map(v=>'<option value="'+esc(v)+'"></option>').join("")+'</datalist>'+
    storeChips+
    '<input class="input" id="e-item" list="e-itemlist" placeholder="品目(任意)" value="'+esc(f.item||"")+'" autocomplete="off" style="margin-bottom:'+(itemChips?"6":"14")+'px">'+
    '<datalist id="e-itemlist">'+entryItemHintsFor(f.store).map(v=>'<option value="'+esc(v)+'"></option>').join("")+'</datalist>'+
    itemChips+amtChips;
  /* v4.05: **振替を記帳画面へ移植(ユーザー設計)**。金を動かす行為の入口を1箇所に集約し、
     貯金・軍資金の各画面は「見る」台帳に純化させる。振替は収支ではないので
     S.entriesには一切書かず、doTransfer経由で各台帳のtxnになる(当月収支は動かない=v3.80の定義通り)。
     編集中(editEntryId!==null)はタイプを切り替えさせない——既存の収支エントリを振替に化けさせないため */
  const isTr = (f.type==="transfer");
  let trHtml="";
  if(isTr){
    const accs=transferAccounts();
    const opt=(a,sel,act)=>'<button class="btn" data-a="'+act+'" data-v="'+a.id+'" style="width:100%;text-align:left;padding:8px 9px;margin-bottom:5px;border-radius:9px;'+
      (sel?'border-color:var(--teal);background:rgba(47,212,181,.10)':'')+'">'+
      '<div style="font-size:11px;font-weight:700;color:'+(sel?'var(--teal)':'var(--text)')+'">'+esc(a.name)+'</div>'+
      '<div class="mono" style="font-size:10px;color:'+(sel?'var(--teal)':'var(--muted)')+'">¥'+a.bal.toLocaleString("ja-JP")+'</div></button>';
    trHtml='<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px">'+
      '<div><div class="muted" style="font-size:10px;margin-bottom:5px">振替元</div>'+
        accs.map(a=>opt(a,String(UI.trFrom||"")===a.id,"trfrom")).join("")+'</div>'+
      '<div><div class="muted" style="font-size:10px;margin-bottom:5px">振替先</div>'+
        accs.map(a=>String(a.id)===String(UI.trFrom||"")
          ? '<div style="height:44px;margin-bottom:5px"></div>'
          : opt(a,String(UI.trTo||"")===a.id,"trto")).join("")+'</div></div>';
    const fa=accs.find(a=>a.id===String(UI.trFrom)), ta=accs.find(a=>a.id===String(UI.trTo));
    if(fa&&ta&&fa!==ta) trHtml+='<div class="teal" style="font-size:11px;margin-bottom:12px;text-align:center;font-weight:700">'+esc(fa.name)+' → '+esc(ta.name)+'</div>';
    else trHtml+='<div class="muted" style="font-size:10px;margin-bottom:12px;text-align:center">振替元と振替先を選んでください</div>';
    trHtml+='<div class="muted" style="font-size:10px;margin:0 2px 12px;line-height:1.7">振替は収支に含まれません。<br>財布の間で金が動いただけだからです。</div>';
  }
  /* v4.14: **どの財布から出したか/入ったか**を記帳時に選ぶ(ユーザー設計)。
     財布が1つしかないときは出さない(摩擦を増やさない)。既定は先頭の財布 */
  let walHtml="";
  if(!isTr && walletPots().length>1){
    const cur=String(f.wal||walletPots()[0].id);
    walHtml='<div class="muted" style="font-size:11px;margin-bottom:5px">'+(f.type==="income"?"どの財布に入る":"どの財布から出す")+'</div>'+
      '<div class="row" style="gap:6px;flex-wrap:wrap;margin-bottom:12px">'+
      walletPots().map(w=>'<button class="btn '+(cur===String(w.id)?"sel":"")+'" data-a="ewal" data-v="'+w.id+'" style="font-size:11px;padding:6px 11px">'+esc(w.name)+
        '<span class="mono muted" style="font-size:9px;display:block">¥'+walletBalance(null,w.id).toLocaleString("ja-JP")+'</span></button>').join("")+'</div>';
  }
  const TYPES = UI.editEntryId!==null ? [["expense","支出"],["income","収入"]]
                                      : [["expense","支出"],["income","収入"],["transfer","振替"]];
  return '<div class="hdr"><button class="navbtn" data-a="back">‹ 戻る</button>'+
    '<div style="font-size:14px;font-weight:700">'+(UI.editEntryId!==null?"記録を編集":isTr?"振替":"記録を追加")+'</div><div style="width:44px"></div></div>'+
    '<div class="row" style="gap:8px;margin-bottom:12px">'+
    TYPES.map(([v,l])=>
      '<button class="btn '+(f.type===v?"sel":"")+'" style="flex:1" data-a="etype" data-v="'+v+'">'+l+'</button>').join("")+'</div>'+
    '<div class="row" style="gap:8px;margin-bottom:12px">'+
    '<input class="input" type="date" id="e-date" value="'+esc(f.date)+'" style="flex:1">'+
    '<input class="input mono r" type="number" inputmode="numeric" id="e-amount" placeholder="金額" value="'+esc(f.amount)+'" style="flex:1"></div>'+
    (isTr ? trHtml
      : f.type==="expense"
      ? ((f.tmode && UI.editEntryId===null) ? '' :
        '<div class="muted" style="font-size:11px;margin:0 2px 6px">支出の分類</div>'+
        '<div class="row" style="gap:8px;margin-bottom:12px">'+
        EXPENSE_CATS.map(c=>'<button class="btn '+(f.category===c?"sel":"")+'" style="flex:1;padding:12px 2px;font-size:13px" data-a="ecat" data-v="'+esc(c)+'">'+esc(c)+'</button>').join("")+'</div>')
      : '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:12px">'+
        INCOME_CATS.map(c=>'<button class="chip '+(f.category===c?"sel":"")+'" data-a="ecat" data-v="'+esc(c)+'">'+esc(c)+'</button>').join("")+'</div>'+
        /* v3.54: 代打はセッションが真実の所在(家計簿の行は派生物)。ここでエントリを作らせず、セッション作成へ routing する。
           日付はフォームの値を引き継ぐ */
        (UI.editEntryId===null?'<button class="btn full" style="margin-bottom:12px;font-size:12px;padding:9px 0;color:var(--teal)" data-a="todai">代打の記録はセッションで入力 →</button>':''))+
    (isTr ? '' : walHtml + transHtml + (composerHtml || fieldsHtml)) +
    (UI.editEntryId!==null?'<button class="btn full" style="margin-bottom:8px;font-size:12px;padding:9px 0;color:var(--teal)" data-a="tofixed">この内容で固定費に登録</button>':'')+
    '<div class="row" style="gap:8px">'+
    (UI.editEntryId!==null?'<button class="btn danger" data-a="edel">削除</button>':'')+
    '<button class="btn primary" style="flex:1" data-a="esave">'+(UI.editEntryId!==null?"更新する":isTr?"振り替える":"追加する")+'</button></div>';
}
function bindEntry(){
  const f = UI.entryForm;
  document.getElementById("e-date").oninput = e=>f.date=e.target.value;
  document.getElementById("e-amount").oninput = e=>f.amount=e.target.value;
  const es=document.getElementById("e-store"); if(es) es.oninput = e=>{ f.store=e.target.value;
    const dl=document.getElementById("e-itemlist");
    if(dl) dl.innerHTML = entryItemHintsFor(f.store).map(v=>'<option value="'+esc(v)+'"></option>').join(""); };
  const ei=document.getElementById("e-item"); if(ei) ei.oninput = e=>f.item=e.target.value;
  const tf=document.getElementById("t-from"); if(tf) tf.oninput = e=>f.tfrom=e.target.value;
  const tt=document.getElementById("t-to"); if(tt) tt.oninput = e=>f.tto=e.target.value;
  const tp=document.getElementById("t-place"); if(tp) tp.oninput = e=>f.tplace=e.target.value;
  document.querySelectorAll("[data-a]").forEach(el=>{
    el.onclick = ()=>{
      const a=el.dataset.a, v=el.dataset.v;
      if(a==="back"){ UI.screen=(UI.entryReturn||"main"); UI.entryReturn=null; render(); }
      else if(a==="etype"){ f.type=v; if(v!=="transfer") f.category = v==="expense"?"消費":"給与"; render(); }
      else if(a==="ewal"){ f.wal=String(v); render(); }
      else if(a==="trfrom"){ UI.trFrom=(String(UI.trFrom||"")===String(v))?"":String(v);
        if(String(UI.trTo||"")===String(UI.trFrom)) UI.trTo=""; render(); }
      else if(a==="trto"){ UI.trTo=(String(UI.trTo||"")===String(v))?"":String(v); render(); }
      else if(a==="todai"){ UI.tab="games"; UI.gameSub="slot";
          UI.draft={id:uid(),date:(f.date||todayStr()),store:"",mode:"dai",partnerName:"",fee:"",startAt:"",endAt:"",
            exchange:S.rates.exchange||"",pExchange:S.rates.pExchange||"",pushPayout:S.rates.pushPayout||"",pushDraw:S.rates.pushDraw||"",machines:[],expenses:[],memo:""};
          UI.whoTab="me"; UI.isNewSess=true; UI.screen="session"; render(); }
      else if(a==="ecat"){ f.category=v; render(); }
      else if(a==="cmore"){ UI.chipMore=!UI.chipMore; render(); }
      else if(a==="ustore"){ f.tmode=""; f.store=el.dataset.v; f.item=""; const c=entryChipCat(f.type,f.store,null); if(c) f.category=c; render(); }
      else if(a==="uitem"){ f.item=el.dataset.v; const c=entryChipCat(f.type,f.store,f.item); if(c) f.category=c; render(); }
      else if(a==="uamt"){ f.amount=String(num(el.dataset.v)); render(); }
      else if(a==="tmode"){ f.tmode=(f.tmode===el.dataset.v?"":el.dataset.v); if(f.tmode){ f.category="消費"; f.store=""; f.item=""; } render(); }
      else if(a==="tkf"){ f.tfrom=el.dataset.v; render(); }
      else if(a==="tkt"){ f.tto=el.dataset.v; render(); }
      else if(a==="tkp"){ f.tplace=el.dataset.v; render(); }
      else if(a==="tofixed"){
        const day = num((f.date||todayStr()).slice(8,10)) || 1;
        UI.fixForm = { type:f.type||"expense", name:(f.item||f.memo||"").trim(), store:(f.store||"").trim(),
          item:(f.item||"").trim(), category:f.category||"消費", freq:"monthly", day:String(day),
          start: todayStr(), amount:String(num(f.amount)||""), holidayShift:"none", days:[], end:"" };
        UI.entryReturn=null; UI.screen="fixed"; render();
        setTimeout(()=>{ try{ toast("内容を引き継ぎました — 頻度と発生日を確認して保存"); }catch(e){} }, 300);
      }
      else if(a==="edel"){
        const ent = S.entries.find(x=>x.id===UI.editEntryId);
        const isFixed = ent && ent.fixedId;
        let fmsg = "";
        if(isFixed){
          /* 次回発生日を実計算して提示(月次・週次・曜日指定すべてに正しい文言) */
          const tpl0 = (S.fixed||[]).find(t=>String(t.id)===String(ent.fixedId));
          let nextTxt = "";
          if(tpl0){
            const occ = fixedOccKey(ent);
            const sk = (tpl0.skips||[]).concat([occ]);
            const nx = fixedOccurrences(tpl0).map(fmtDate).find(d=> d>occ && !sk.includes(d));
            nextTxt = nx ? "次回は "+nx.slice(5).replace("-","/")+" に自動計上されます。" : "以降の予定はありません(最終分)。";
          }
          /* confirmの折返し幅(約18全角)に収まる意図した行割り */
          fmsg = "今回分("+ent.date.slice(5).replace("-","/")+")をスキップします。\n(定期設定は残ります)\n"+nextTxt+"\nよろしいですか?";
        }
        if(!confirm(isFixed ? fmsg : "この記録を削除しますか?")) return;
        if(isFixed){
          const tpl = (S.fixed||[]).find(t=>String(t.id)===String(ent.fixedId));
          if(tpl){ const occ=fixedOccKey(ent); tpl.skips = tpl.skips || []; if(!tpl.skips.includes(occ)) tpl.skips.push(occ); }
        }
        S.entries = S.entries.filter(x=>x.id!==UI.editEntryId);
        save(); UI.screen=(UI.entryReturn||"main"); UI.entryReturn=null; render();
      }
      else if(a==="esave"){
        const amt = num(f.amount);
        if(!f.date || amt<=0) return;
        /* v4.05: 振替はS.entriesに書かない(収支ではない)。doTransferが各台帳のtxnへ落とす */
        if(f.type==="transfer"){
          if(!UI.trFrom||!UI.trTo||String(UI.trFrom)===String(UI.trTo)){ toast("振替元と振替先を選んでください"); return; }
          const accs=transferAccounts();
          const fa=accs.find(x=>x.id===String(UI.trFrom)), ta=accs.find(x=>x.id===String(UI.trTo));
          if(!fa||!ta) return;
          if(amt>fa.bal && !confirm(fa.name+"の残高 ¥"+fa.bal.toLocaleString("ja-JP")+" を超えます。続けますか?")) return;
          /* v4.10: **軍資金への振替は出所を問わず全て警告する**(ユーザー指摘)。
             v4.05は貯金からの補充だけを見ていたが、**実際に起きるのは所持金からの補充**——
             負けた分をその場の手元金で埋めるのが現実の経路。出所で漏れかどうかは決まらない。
             軍資金へ金が入る = 遊技の負けを外から埋める、という一点だけが本質。
             文面だけは出所に合わせて何を削っているのかを名指しする */
          /* v4.11: **月あたりの補充枠を超えたときだけ警告する**(ユーザー設計)。
             毎回出す警告は必ず読み飛ばされる。枠内(既定¥30,000/月)は計画的な資金投入として黙って通し、
             超えた瞬間だけ止める。**出所は問わない**——貯金→所持金→軍資金と迂回しても
             最後は必ずtopupになるので、月次合計で見れば同じ数字になる */
          if(ta.id===ACC_BANK){
            const cap=bankRefillCap(), used=bankRefillUsed(String(f.date).slice(0,7));
            if(used+amt > cap){
              const over=used+amt-cap;
              const why = isWalAcc(fa.id)
                ? "生活費を削って遊技に回す行為です。"
                : "目的を決めて取り分けた金を崩す行為です。";
              const msg = "今月の補充枠 ¥"+cap.toLocaleString("ja-JP")+" を超えます。"+
                "\n\n今月すでに ¥"+used.toLocaleString("ja-JP")+" 補充済み"+
                "\n今回 ¥"+amt.toLocaleString("ja-JP")+" → 枠を ¥"+over.toLocaleString("ja-JP")+" 超過"+
                "\n現在の軍資金 ¥"+bankBalance().toLocaleString("ja-JP")+
                "\n\n"+why+"\n負けを外の金で埋めるのが、あなたの20年来の漏れです。"+
                "\n\n本当に移しますか?";
              if(!confirm(msg)) return;
            }
          }
          if(!doTransfer(fa.id, ta.id, amt, f.date)) return;
          save(); toast(fa.name+" → "+ta.name+" ¥"+amt.toLocaleString("ja-JP"));
          UI.screen=(UI.entryReturn||"main"); UI.entryReturn=null; render(); return;
        }
        /* v3.31: 交通コンポーザの合成(新規のみ)。表記規約を構造で強制し、データは従来の文字列規約に落とす */
        if(f.type==="expense" && f.tmode && UI.editEntryId===null){
          if(f.tmode==="駐輪"){ const pl=(f.tplace||"").trim(); if(!pl) return; f.store=pl; f.item="駐輪"; }
          else { const ta=(f.tfrom||"").trim(), tb=(f.tto||"").trim(); if(!ta||!tb) return; f.store=f.tmode; f.item=ta+"→"+tb; }
          f.category="消費";
        }
        const store=(f.store||"").trim(), item=(f.item||"").trim();
        const memo=[store,item].filter(Boolean).join(" ");
        const wal = String(f.wal || walletPots()[0].id);   /* v4.14: どの財布から出たか */
        if(UI.editEntryId!==null){
          S.entries = S.entries.map(x=>x.id===UI.editEntryId ?
            Object.assign({},x,{date:f.date,type:f.type,category:f.category,amount:amt,store,item,memo,wal}) : x);
        } else {
          S.entries.push({id:uid(),date:f.date,type:f.type,category:f.category,amount:amt,store,item,memo,wal});
        }
        save(); UI.screen=(UI.entryReturn||"main"); UI.entryReturn=null; render();
      }
    };
  });
}
</script>
<script>
/* ============================================================
   セッション編集画面
   ============================================================ */
/* v3.51: セッション店名の予測。登録店舗(S.stores)+過去セッション店名を併合し頻度順。表記ゆれを構造で抑える */
function sessStoreHints(){
  const m={};
  (S.stores||[]).forEach(st=>{ const n=(st.name||"").trim(); if(n) m[n]=(m[n]||0)+1000; });
  (S.sessions||[]).forEach(s=>{ const n=(s.store||"").trim(); if(n) m[n]=(m[n]||0)+1; });
  return Object.entries(m).sort((a,b)=>b[1]-a[1]).map(x=>x[0]).slice(0,5);
}
function nameHints(){
  const seen=[];
  S.sessions.slice().sort((a,b)=>a.date<b.date?1:-1).forEach(s=>{
    const n=(s.partnerName||"").trim();
    if(n && !seen.includes(n)) seen.push(n);
  });
  return seen.slice(0,5);
}

function viewSession(){
  const s = UI.draft;
  let h = '<div class="hdr"><button class="navbtn" data-a="back">‹ 戻る</button>'+
    '<div style="font-size:14px;font-weight:700">'+(UI.isNewSess?"稼働を記録":"稼働を編集")+'</div><div style="width:44px"></div></div>';
  h += '<div class="row" style="gap:8px;margin-bottom:10px">'+
    '<input class="input" type="date" id="s-date" value="'+esc(s.date)+'" style="flex:1">'+
    '<input class="input" id="s-store" placeholder="店名" value="'+esc(s.store)+'" style="flex:1.4"></div>';
  { const sh=sessStoreHints().filter(n=>n!==(s.store||"").trim());
    if(sh.length) h += '<div class="row" style="flex-wrap:wrap;gap:6px;margin:-4px 0 10px">'+
      sh.map(n=>'<button class="chip" data-a="sstore" data-v="'+esc(n)+'">'+esc(n)+'</button>').join("")+'</div>'; }
  h += '<div class="row" style="gap:8px;align-items:center;margin-bottom:10px">'+
    '<span class="muted" style="font-size:12px;width:74px">実働</span>'+
    '<input class="input mono" type="time" id="s-tstart" value="'+esc(s.startAt||"")+'" style="flex:1">'+
    '<span class="muted" style="font-size:12px">〜</span>'+
    '<input class="input mono" type="time" id="s-tend" value="'+esc(s.endAt||"")+'" style="flex:1"></div>';
  h += '<div class="row" style="gap:8px;margin-bottom:10px">'+
    [["nori","乗打"],["dai","代打"],["solo","単独"]].map(([v,l])=>
      '<button class="btn '+(s.mode===v?"sel":"")+'" style="flex:1" data-a="mode" data-v="'+v+'">'+l+'</button>').join("")+'</div>';

  /* v3.51: 抽選のみの代打(実務で頻出)。第4モードではなく代打の下位フラグ——集計上は代打の一種として数えたいため。
     ONで台データ・交換設定を畳み、報酬/店名/経費だけの姿にする */
  if(s.mode==="dai"){
    h += '<div class="row" style="gap:8px;margin-bottom:10px">'+
      '<button class="btn '+(s.lotteryOnly?"sel":"")+'" style="flex:1;font-size:13px" data-a="lottery">'+(s.lotteryOnly?"✓ ":"")+'抽選のみ(台に座らず)</button></div>';
  }
  if(s.mode!=="solo"){
    const hints = nameHints().filter(n=>n!==(s.partnerName||"").trim());
    h += '<div style="margin-bottom:12px"><input class="input" id="s-pname" placeholder="'+
      (s.mode==="nori"?"相方の名前":"依頼主の名前")+'" value="'+esc(s.partnerName||"")+'">'+
      (hints.length?'<div class="row" style="flex-wrap:wrap;gap:6px;margin-top:6px">'+
        hints.map(n=>'<button class="chip" data-a="pname" data-v="'+esc(n)+'">'+esc(n)+'</button>').join("")+'</div>':'')+'</div>';
  }

  /* ----- 交換設定(セッション共通) ----- */
  if(!(s.mode==="dai"&&s.lotteryOnly)){
  h += band("交換設定");
  if((S.stores||[]).length) h += '<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:8px">'+
    (S.stores||[]).map(st=>'<button class="chip" data-a="applystore" data-v="'+st.id+'">'+esc(st.name)+'</button>').join("")+'</div>';
  h += '<div class="row" style="gap:8px;align-items:center;margin-bottom:6px">'+
    '<span class="muted" style="font-size:12px;width:74px">スロット</span>'+
    '<input class="input mono r" type="number" inputmode="numeric" placeholder="例: 50" value="'+esc(s.exchange||"")+'" style="flex:1" data-in="exchange">'+
    '<span class="muted" style="font-size:12px">枚=1000円</span></div>'+
    '<div class="row" style="gap:8px;align-items:center;margin-bottom:6px">'+
    '<span class="muted" style="font-size:12px;width:74px">パチンコ</span>'+
    '<input class="input mono r" type="number" inputmode="numeric" placeholder="例: 250" value="'+esc(s.pExchange||"")+'" style="flex:1" data-in="pexchange">'+
    '<span class="muted" style="font-size:12px">玉=1000円</span></div>'+
    '<div class="muted" style="font-size:10px">使う方だけ入力。前回値を記憶します。<br>貯玉プッシュのレートはツールのボーダー試算で設定。</div>';
  }

  /* ----- 代打ち: 報酬 ----- */
  if(s.mode==="dai"){
    h += band("報酬(家計簿に反映)");
    h += '<div><div class="muted" style="font-size:11px;margin:0 2px 4px">受取報酬(円)</div>'+
      '<input class="input mono r" type="number" inputmode="numeric" placeholder="例: 15000" value="'+esc(s.fee)+'" data-in="fee"></div>';
  }

  /* ----- 台データ(貯玉方式) ----- */
  if(s.mode==="nori"){
    /* 乗り打ち: 自分/相方タブ */
    const who = UI.whoTab || "me";
    const pn = (s.partnerName||"").trim()||"相方";
    h += band("打った台");
    h += '<div class="row" style="gap:8px;margin-bottom:10px">'+
      [["me","自分"],["partner",pn]].map(([v,l])=>
        '<button class="btn '+(who===v?"sel":"")+'" style="flex:1" data-a="whotab" data-v="'+v+'">'+esc(l)+
        ' <span class="mono" style="font-size:11px">'+signYen(personSlotYen(s,v))+'</span></button>').join("")+'</div>';
    slotMachines(s, who).forEach(m=>{ h += viewSlotMachine(m, s); });
    (s.machines||[]).filter(m=>m.kind==="pachi" && (m.who||"me")===who).forEach(m=>{ h += viewMachine(m, s); });
    h += '<div class="row" style="gap:8px">'+
      '<button class="btn dash" style="flex:1" data-a="maddw" data-v="slot|'+who+'">＋ スロット台</button>'+
      '<button class="btn dash" style="flex:1" data-a="maddw" data-v="pachi|'+who+'">＋ パチンコ台</button></div>';
  } else if(!(s.mode==="dai"&&s.lotteryOnly)){
    h += band(s.mode==="dai" ? "打った台(客の玉・報告用)" : "打った台");
    slotMachines(s).forEach(m=>{ h += viewSlotMachine(m, s); });
    (s.machines||[]).filter(m=>m.kind==="pachi").forEach(m=>{ h += viewMachine(m, s); });
    h += '<div class="row" style="gap:8px">'+
      '<button class="btn dash" style="flex:1" data-a="madd" data-v="slot">＋ スロット台</button>'+
      '<button class="btn dash" style="flex:1" data-a="madd" data-v="pachi">＋ パチンコ台</button></div>';
  }

  /* ----- 経費 ----- */
  h += band("経費(飲食など)");
  (s.expenses||[]).forEach(x=>{
    h += '<div class="row" style="gap:6px;margin-bottom:6px">'+
      '<input class="input sm" placeholder="店名" value="'+esc(x.store||"")+'" style="flex:1" data-in="xstore" data-v="'+x.id+'">'+
      '<input class="input sm" placeholder="品目" value="'+esc(x.item!=null?x.item:(x.label||""))+'" style="flex:1.2" data-in="xitem" data-v="'+x.id+'">'+
      '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="金額" value="'+esc(x.amount)+'" style="flex:0.9;min-width:72px" data-in="xamount" data-v="'+x.id+'">'+
      '<button class="xbtn" data-a="xdel" data-v="'+x.id+'">×</button></div>';
  });
  h += '<button class="btn dash full" data-a="xadd">＋ 経費を追加</button>';
  h += '<button class="btn dash full" style="margin-top:6px" data-a="xfopen">⇄ 家計簿から振替</button>';
  if(UI.xferOpen){ h += xferHint + xferRowsHtml(xferCandidates(s.date, s.expenses), "xfpick"); }

  /* ----- サマリー ----- */
  h += band("このセッションの結果");
  h += '<div class="card" id="ssummary">'+sessionSummary(s)+'</div>';
  h += '<input class="input" placeholder="セッションメモ(任意)" value="'+esc(s.memo||"")+'" style="margin:14px 0" data-in="smemo">';
  h += '<div class="row" style="gap:8px">'+
    (!UI.isNewSess?'<button class="btn danger" data-a="sdel">削除</button>':'')+
    '<button class="btn primary" style="flex:1;padding:12px 0" data-a="ssave">保存する</button></div>';
  return h;
}

function sessionSummary(s){
  const srow = (l,v) => '<div class="row between" style="font-size:13px;margin:4px 0"><span class="muted">'+l+'</span><span class="mono '+clsPM(v)+'">'+signYen(v)+'</span></div>';
  let h = "";
  if(s.mode==="dai"){
    /* 代打ち: 報酬が家計簿へ。台勝敗は報告用 */
    const dai = daiResult(s);
    if(slotMachines(s).some(machHasData)){
      h += '<div class="card2" style="margin-bottom:10px"><div class="row between" style="align-items:baseline">'+
        '<span style="font-size:11px;font-weight:700">客の玉での勝敗(報告用)</span>'+
        '<span class="mono '+clsPM(dai)+'" style="font-size:16px;font-weight:700">'+signYen(dai)+'</span></div>'+
        '<div class="muted" style="font-size:10px;margin-top:4px">この金額は家計簿には反映されません</div></div>';
    }
    h += srow("報酬", num(s.fee));
    h += srow("経費(自分負担分)", -expTotal(s));
    const fin = finalOwn(s);
    h += '<div style="height:1px;background:var(--line);margin:8px 0"></div>'+
      '<div class="row between" style="align-items:baseline"><span style="font-size:12px;font-weight:700">代打ち報酬(家計簿の収入へ)</span>'+
      '<span class="mono '+clsPM(fin)+'" style="font-size:20px;font-weight:700">'+signYen(fin)+'</span></div>'+
      '<div class="muted" style="font-size:10px;margin-top:4px">労働収入なので家計簿の収入に計上(軍資金には入りません)</div>';
    return h;
  }
  if(s.mode==="nori"){
    const me = personSlotYen(s,"me"), pt = personSlotYen(s,"partner"), pn = esc((s.partnerName||"").trim()||"相方");
    h += '<div class="row" style="gap:8px;margin-bottom:10px">'+
      '<div class="card2" style="flex:1;text-align:center"><div class="muted" style="font-size:10px">自分</div>'+
      '<div class="mono '+clsPM(me)+'" style="font-size:15px;font-weight:700">'+signYen(me)+'</div></div>'+

      '<div class="mono '+clsPM(pt)+'" style="font-size:15px;font-weight:700">'+signYen(pt)+'</div></div></div>';
    h += srow("2人合計", poolTotal(s));
    /* 折半調整: 自分の取り分を編集可、相方は残りを自動 */
    const half = halfSplit(s), mine = myShare(s), theirs = partnerShare(s);
    const adjusted = (s.myShare!==undefined && s.myShare!=="" && num(s.myShare)!==half);
    h += '<div class="row between" style="align-items:center;font-size:13px;margin:8px 0 4px">'+
      '<span class="muted">自分の取り分</span>'+
      '<div class="row" style="align-items:center;gap:6px">'+
      '<span class="mono muted" style="font-size:12px">¥</span>'+
      '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="'+half+'" value="'+esc(s.myShare!==undefined?s.myShare:"")+'" style="width:100px" data-in="myshare">'+
      '</div></div>';
    h += '<div class="row between" style="font-size:12px;margin:2px 0 4px"><span class="muted">'+esc((s.partnerName||"").trim()||"相方")+'の取り分(自動)</span>'+
      '<span class="mono '+clsPM(theirs)+'">'+signYen(theirs)+'</span></div>';
    if(adjusted) h += '<div class="muted" style="font-size:10px;margin-bottom:2px">折半'+signYen(half)+'から調整済み(差'+signYen(mine-half)+')</div>';
  }
  if(s.mode==="nori"){
    h += srow("経費(自分負担分)", -expTotal(s));
    const fin = finalOwn(s);
    h += '<div style="height:1px;background:var(--line);margin:8px 0"></div>'+
      '<div class="row between" style="align-items:baseline"><span style="font-size:12px;font-weight:700">最終収支(家計簿へ連携)</span>'+
      '<span class="mono '+clsPM(fin)+'" style="font-size:20px;font-weight:700">'+signYen(fin)+'</span></div>';
    return h;
  }
  h += srow("自分の収支", grossOwn(s));
  h += srow("経費(自分負担分)", -expTotal(s));
  const fin = finalOwn(s);
  h += '<div style="height:1px;background:var(--line);margin:8px 0"></div>'+
    '<div class="row between" style="align-items:baseline"><span style="font-size:12px;font-weight:700">最終収支(家計簿へ連携)</span>'+
    '<span class="mono '+clsPM(fin)+'" style="font-size:20px;font-weight:700">'+signYen(fin)+'</span></div>';
  return h;
}

const segStat = (g, s) => segDone(g) ? segUsed(g,s)+"発 / "+segSpins(g)+"回転" : "";
const segFormula = (g, s) => {

  const pp = num((s&&s.pushPayout)||(UI.draft&&UI.draft.pushPayout)||230);

function borderPanel(m, s){
  const t = machineTotals(m, s);
  if(t.rate250===null) return "";
  const master = findMaster(m);
  const denom = master ? fnum(master.denom) : 0;
  const kez = Math.max(0, Math.min(50, fnum(m.kezuri)));   // 削り率 %
  const kezF = 1 - kez/100;
  // 理論ボーダー(回/250発相当): 登録機種は 分母×250/理論TY、未登録は手入力ボーダー(回/千円=等価で同値)
  const bTheory = denom>0
    ? (master && fnum(master.ty)>0 ? denom*250/fnum(master.ty) : null)
    : (fnum(m.border)>0 ? fnum(m.border) : null);
  // 削り後ボーダー = 理論B ÷ (1−削り率/100)。出玉が減る→ボーダーは上がる(厳しくなる)
  const bKezuri = (bTheory!==null && kez>0 && kezF>0) ? bTheory/kezF : null;
  // 実効ボーダー(実測avgTY): 参考・削り率の較正用。短期サンプルは荒れるので判定基準にはしない
  const bEff = denom>0 && t.avgTY>0 ? denom*250/t.avgTY : null;
  // 判定基準(active border): 削り後 → 理論 → 実効(理論が無い時のみ)
  const ab = bKezuri!==null ? bKezuri : (bTheory!==null ? bTheory : bEff);
  const dev = ab && t.costRate250!==null ? (t.costRate250/ab-1)*100 : null;

  let h = '<div class="amberpanel"><div class="row between" style="align-items:baseline;margin-bottom:6px">'+
    '<span class="mono muted" style="font-size:11px">累計 '+t.balls+'発 / '+t.spins+'回転</span>'+
    '<span class="mono amber" style="font-size:15px;font-weight:700">≒ '+t.rate250.toFixed(2)+' 回/250発</span></div>';
  if(t.costRate250!==null && Math.abs(t.costRate250-t.rate250)>0.005)
    h += '<div class="row between" style="font-size:11px;margin-bottom:6px"><span class="muted">コスト補正(貯玉手数料込)</span>'+
      '<span class="mono">'+t.costRate250.toFixed(2)+' 回/250発</span></div>';
  // --- 理論ボーダー ---
  if(denom>0){
    h += '<div class="row between" style="font-size:11px;margin-bottom:4px"><span class="muted">機種データ: 1/'+fnum(master.denom)+
      (fnum(master.ty)>0?' / 理論TY '+fnum(master.ty)+'発':'')+'</span>'+
      (bTheory!==null?'<span class="mono">理論B '+bTheory.toFixed(2)+'</span>':'')+'</div>';
  } else {
    h += '<div style="margin:4px 0 6px"><div class="muted" style="font-size:9px;margin-bottom:2px">理論ボーダー(回/千円)</div>'+
      '<input class="input sm mono r" type="number" inputmode="decimal" step="0.1" value="'+esc(m.border||"")+'" data-in="mborder" data-v="'+m.id+'"></div>';
  }
  // --- 削り後ボーダー(判定基準) ---
  if(bKezuri!==null)
    h += '<div class="row between" style="font-size:12px;margin-bottom:4px"><span style="font-weight:700">削り後B(削り'+kez+'%)</span>'+
      '<span class="mono amber" style="font-weight:700">'+bKezuri.toFixed(2)+' 回/250発</span></div>';
  // --- 実測(参考・較正用) ---
  if(t.avgTY!==null)
    h += '<div style="font-size:10px;margin-bottom:4px" class="muted">参考: 実測平均出玉 '+t.payouts.length+'回 '+Math.round(t.avgTY)+'発'+
      (bEff!==null?' → 実効B '+bEff.toFixed(2):'')+'</div>';
  if(dev!==null && ab)
    h += '<div class="row between" style="align-items:baseline;border-top:1px solid rgba(242,179,61,.3);padding-top:6px;margin-top:2px">'+
      '<span style="font-size:11px;font-weight:700">ボーダー乖離</span>'+
      '<span class="mono '+clsPM(dev)+'" style="font-size:15px;font-weight:700">'+(dev>=0?"+":"−")+Math.abs(dev).toFixed(1)+'%'+
      '<span class="muted" style="font-size:10px;font-weight:400"> ('+(t.costRate250>=ab?"+":"−")+Math.abs(t.costRate250-ab).toFixed(2)+'回)</span></span></div>';
  // --- 時給(遊技モード別 what-if。現在の出玉効率 rate250 を各モードの単価で評価し直す) ---
  const bJudge = bKezuri!==null ? bKezuri : bTheory;
  const kachi = fnum(m.kachi);
  // 回転数/時: 開始時刻があり経過5分〜18hなら実測、それ以外は仮定値
  let rphUsed = fnum(m.rph), rphMeasured = null, elapsedH = null;
  if(m.startedAt){
    elapsedH = (Date.now()-m.startedAt)/3600000 - fnum(m.breakMin)/60;
    if(elapsedH >= 5/60 && elapsedH <= 18 && t.spins>0){ rphMeasured = t.spins/elapsedH; rphUsed = rphMeasured; }
  }
  if(bJudge!==null && rphUsed>0 && kachi>0 && t.rate250>0){
    const uK = 1000/kachi;   // 換金単価(円/玉)
    const uC = fnum(m.genkin)>0 ? 1000/fnum(m.genkin) : uK;   // 現金貸出単価(円/玉、貸出削り込み)
    const hedari = (fnum(m.pushDraw)>0 && fnum(m.pushPayout)>0) ? fnum(m.pushDraw)/fnum(m.pushPayout) : 245/230;  // 貯玉プッシュ手数料比
    const wMochi   = rphUsed*250*uK*(1/bJudge - 1/t.rate250);            // 持玉:換金単価・手数料なし
    const wChodama = rphUsed*250*uK*(1/bJudge - hedari/t.rate250);       // 貯玉:換金単価・引落/払出の手数料
    const wCash    = rphUsed*250*(uK/bJudge - uC/t.rate250);             // 現金:出玉=換金単価/投資=貸出単価
    const hasCash  = (m.segments||[]).some(g=>num(g.cash)>0);
    let rphLine;
    if(rphMeasured!==null) rphLine = '実測 '+Math.round(rphMeasured).toLocaleString()+'回転/時 (経過'+elapsedH.toFixed(1)+'h'+(fnum(m.breakMin)>0?'・休憩'+fnum(m.breakMin)+'分':'')+'・'+t.spins.toLocaleString()+'回転) → 反映中';
    else if(m.startedAt) rphLine = '計測中 経過'+Math.round(Math.max(0,elapsedH)*60)+'分 — 仮定値 '+fnum(m.rph)+'回転/時を使用';
    else rphLine = '仮定値 '+fnum(m.rph)+'回転/時(区間入力で開始時刻を自動記録→実測に切替)';
    const wl = (label,val,strong)=> '<div class="row between" style="font-size:'+(strong?12:11)+'px;margin-bottom:3px">'+
      '<span'+(strong?' style="font-weight:700"':' class="muted"')+'>'+label+'</span>'+
      '<span class="mono '+clsPM(val)+'"'+(strong?' style="font-weight:700"':'')+'>'+(val>=0?"+":"−")+Math.round(Math.abs(val)).toLocaleString()+'円/時</span></div>';
    h += '<div style="border-top:1px solid rgba(242,179,61,.3);padding-top:6px;margin-top:6px">'+
      '<div class="muted" style="font-size:9px;margin-bottom:3px">時給 — 削り後B基準 / '+esc(rphLine)+'</div>'+
      wl("持玉遊技", wMochi, true)+
      wl("貯玉遊技", wChodama, false)+
      (hasCash ? wl("現金遊技", wCash, false) : '')+'</div>';
  }
  return h+'</div>';
}

/* ---------- ボーダー試算ツール(独立・収支とは無関係) ---------- */
function viewBorderTool(){
  const m = S.borderTool;
  const rates = { pushPayout: m.pushPayout, pushDraw: m.pushDraw, genkin: m.genkin };

  let h = '<div class="row between" style="align-items:center;margin-bottom:6px">'+

  h += '<div class="muted" style="font-size:11px;margin-bottom:12px">この台を続けるか判断する試算(収支の記録とは別)。<br>着席時・当たり後の再開時・現金追加時に区間を追加。<br>回転率とボーダー乖離が出ます。</div>';

  /* 貯玉プッシュ レート */

  h += band("貯玉プッシュ(玉/回)");
  h += '<div class="card" style="margin-bottom:12px"><div class="grid2">'+
    '<div><div class="muted" style="font-size:9px;margin-bottom:2px">払出(出玉計算用)</div>'+
    '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="230" value="'+esc(m.pushPayout||"")+'" data-bi="pushPayout"></div>'+
    '<div><div class="muted" style="font-size:9px;margin-bottom:2px">引落(コスト計算用)</div>'+
    '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="245" value="'+esc(m.pushDraw||"")+'" data-bi="pushDraw"></div></div>'+
    '<div class="muted" style="font-size:10px;margin-top:5px">貯玉プッシュを使う時だけ入力。持ち玉(玉数)区間のみなら不要。</div></div>';

  /* 機種名 */
  h += band("機種");
  const pachiList = (S.mdb||[]).filter(x=>x.kind==="pachi" && (x.name||"").trim());
  h += '<div class="card" style="margin-bottom:12px"><div class="muted" style="font-size:9px;margin-bottom:2px">機種名</div>'+
    '<input class="input sm" placeholder="機種名(下から選択 or 手入力)" value="'+esc(m.name||"")+'" data-bi="name">'+
    (master ? '<div class="mono teal" style="font-size:10px;margin-top:4px">✓ 登録あり: 1/'+fnum(master.denom)+(fnum(master.ty)>0?' / 理論TY '+fnum(master.ty)+'発':'')+'</div>'
      : (m.name?'<div class="muted" style="font-size:10px;margin-top:4px">未登録 — 下でボーダーを手入力できます</div>':''))+
    (pachiList.length ? '<div style="margin-top:8px"><div class="muted" style="font-size:9px;margin-bottom:4px">登録機種から選ぶ</div><div class="row" style="flex-wrap:wrap;gap:6px">'+
      pachiList.map(x=>'<button class="chip'+((m.name||"").trim()===(x.name||"").trim()?' sel':'')+'" data-a="btpick" data-v="'+x.id+'">'+esc(x.name)+'</button>').join("")+'</div></div>' : '')+
    '</div>';

  /* 削り率 */
  h += band("削り率(出玉の削れ)");
  h += '<div class="card" style="margin-bottom:12px"><div class="row" style="gap:8px;align-items:center">'+
    '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="5" value="'+esc(m.kezuri||"")+'" style="width:84px" data-bi="kezuri">'+
    '<span class="muted" style="font-size:12px">% 理論を下回る分</span></div>'+
    '<div class="muted" style="font-size:10px;margin-top:5px;line-height:1.6">釘の削りで出玉が理論に届かない分。<br>この分だけ厳しくした<b>削り後ボーダー</b>で判定します。<br>例: 5%=出玉が理論の95%。0なら理論ボーダー基準。<br>店・釘に合わせて調整。前回値を記憶します。</div></div>';

  /* 時給の設定 */
  h += band("時給の設定");
  const _hm = ts => { const d=new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
  h += '<div class="card" style="margin-bottom:12px"><div class="grid2">'+
    '<div><div class="muted" style="font-size:9px;margin-bottom:2px">換金率(1000円=◯玉)</div>'+
    '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="250" value="'+esc(m.kachi||"")+'" data-bi="kachi"></div>'+
    '<div><div class="muted" style="font-size:9px;margin-bottom:2px">現金貸出(1000円=◯玉)</div>'+
    '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="250" value="'+esc(m.genkin||"")+'" data-bi="genkin"></div></div>'+
    '<div style="margin-top:6px"><div class="muted" style="font-size:9px;margin-bottom:2px">回転数/時(仮定値・実測が出るまで使用)</div>'+
    '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="750" value="'+esc(m.rph||"")+'" style="width:130px" data-bi="rph"></div>'+
    '<div style="border-top:1px solid var(--line);margin-top:10px;padding-top:8px">'+
      '<div class="row between" style="align-items:center;margin-bottom:6px">'+
        '<div class="row" style="gap:8px;align-items:center"><span class="muted" style="font-size:9px">開始</span>'+
          '<span class="mono" style="font-size:13px;font-weight:700" id="bt-started">'+(m.startedAt?_hm(m.startedAt):"—")+'</span>'+
          '<input class="input sm mono r" type="time" value="'+(m.startedAt?_hm(m.startedAt):"")+'" style="width:104px;padding:4px 6px" data-bstart></div>'+
        '<button class="chip" data-a="startnow" style="font-size:10px">今にリセット</button></div>'+
      '<div class="row" style="gap:8px;align-items:center"><span class="muted" style="font-size:9px;width:28px">休憩</span>'+
        '<input class="input sm mono r" type="number" inputmode="numeric" placeholder="0" value="'+esc(m.breakMin||"")+'" style="width:80px" data-bi="breakMin">'+
        '<span class="muted" style="font-size:11px">分(昼休憩など経過から除く)</span></div></div>'+
    '<div class="muted" style="font-size:10px;margin-top:8px;line-height:1.6">換金率=出玉の価値(等価4円なら250玉)。<br>現金貸出=貸出で削る店の実玉数。<br>開始時刻は初回区間の入力で自動記録。ズレたら修正可。<br>前回値を記憶(開始・休憩はクリアで初期化)。</div></div>';

  /* 通常時区間(貯玉プッシュ一本化) */
  h += band("通常時 区間");
  h += '<div class="muted" style="font-size:10px;margin-bottom:8px;line-height:1.6">貯玉プッシュ区間: 残プッシュを入力。<br>持ち玉区間: <b>残プッシュを空</b>にして残玉に持ち玉。<br>現金区間: <b>現金投資(円)</b>を入力。</div>';
  h += '<div style="margin-bottom:8px">';
  const segFields = [["rpStart","開始 残プッシュ"],["rpEnd","終了 残プッシュ"],["sb","開始 残玉"],["eb","当たり時 残玉"],["ss","開始 回転数"],["es","当たり時 回転数"],["cash","現金投資(円)"]];
  (m.segments||[]).forEach((g,gi)=>{
    h += '<div class="card2" style="margin-bottom:6px"><div class="row between" style="margin-bottom:6px">'+
      '<span class="muted" style="font-size:10px;font-weight:700">区間'+(gi+1)+'</span>'+
      '<div class="row" style="gap:8px"><span class="mono muted" style="font-size:10px" id="segs-'+g.id+'">'+segStat(g,rates)+'</span>'+
      '<button class="xbtn" style="font-size:14px" data-a="btgdel" data-v="'+g.id+'">×</button></div></div>'+
      '<div class="grid2">'+segFields.map(([k,label])=>
        '<div><div class="muted" style="font-size:9px;margin-bottom:2px">'+label+'</div>'+
        '<input class="input sm mono r" type="number" inputmode="numeric" value="'+esc(g[k]||"")+'" data-bseg="'+g.id+'|'+k+'"></div>').join("")+'</div>'+
      '<div class="mono muted" style="font-size:10px;margin-top:5px" id="segf-'+g.id+'">'+segFormula(g,rates)+'</div></div>';
  });
  h += '<button class="btn dash full" style="margin-bottom:6px" data-a="btgadd">＋ 区間を追加(着席時/当たり後の再開時/現金追加時)</button>';
  h += '<div id="bt-panel">'+borderPanel(m, rates)+'</div>';
  h += '</div><div style="height:30px"></div>';
  return h;
}
function updateBtPanel(){
  const m = S.borderTool;
  const rates = { pushPayout: m.pushPayout, pushDraw: m.pushDraw, genkin: m.genkin };
  const el = document.getElementById("bt-panel");
  if(el){
    el.innerHTML = borderPanel(m, rates);
    /* パネル内の手入力欄(未登録機種のみ)はinnerHTML差し替えでハンドラが外れるので張り直す */
    el.querySelectorAll("[data-in='mborder']").forEach(x=>{ x.oninput=()=>{ m.border=x.value; saveLocal(); }; x.onchange=()=>{ save(); render(); }; });
    el.querySelectorAll("[data-in='mty']").forEach(x=>{ x.oninput=()=>{ m.ty=x.value; saveLocal(); }; x.onchange=()=>{ save(); render(); }; });
  }
  (m.segments||[]).forEach(g=>{
    const sf=document.getElementById("segf-"+g.id); if(sf) sf.textContent = segFormula(g, rates);
    const ss=document.getElementById("segs-"+g.id); if(ss) ss.textContent = segStat(g, rates);
  });
  const st=document.getElementById("bt-started");
  if(st) st.textContent = m.startedAt ? (String(new Date(m.startedAt).getHours()).padStart(2,"0")+":"+String(new Date(m.startedAt).getMinutes()).padStart(2,"0")) : "—";
}
function bindBorderTool(){
  const m = S.borderTool;
  document.querySelectorAll("[data-bi]").forEach(el=>{ el.oninput=e=>{ m[el.dataset.bi]=e.target.value; saveLocal(); if(el.dataset.bi==="name") render(); }; el.onchange=()=>{ if(el.dataset.bi==="name"){ save(); render(); } else { save(); updateBtPanel(); } }; });
  document.querySelectorAll("[data-bseg]").forEach(el=>{ el.oninput=e=>{ const [gid,k]=el.dataset.bseg.split("|"); const g=(m.segments||[]).find(x=>String(x.id)===String(gid)); if(g){ g[k]=e.target.value; if(!m.startedAt && e.target.value!=="") m.startedAt=Date.now(); saveLocal(); updateBtPanel(); } }; el.onchange=()=>{ save(); }; });
  document.querySelectorAll("[data-bstart]").forEach(el=>{ el.onchange=e=>{ const v=e.target.value; if(v){ const p=v.split(":"); const d=new Date(); d.setHours(Number(p[0])||0, Number(p[1])||0, 0, 0); m.startedAt=d.getTime(); save(); render(); } }; });
  document.querySelectorAll("[data-in='mborder']").forEach(el=>{ el.oninput=e=>{ m.border=e.target.value; saveLocal(); }; el.onchange=()=>{ save(); render(); }; });
  document.querySelectorAll("[data-in='mty']").forEach(el=>{ el.oninput=e=>{ m.ty=e.target.value; saveLocal(); }; el.onchange=()=>{ save(); render(); }; });
  document.querySelectorAll("[data-a]").forEach(el=>{
    const a=el.dataset.a, v=el.dataset.v;
    el.onclick=()=>{
      if(a==="btback"){ UI.screen="main"; UI.tab="tool"; render(); }
      else if(a==="btreset"){ if(confirm("試算をクリアしますか?(機種名・区間をすべて消します)")){ S.borderTool={id:"bt",kind:"pachi",name:"",segments:[],border:"",ty:"",pushPayout:m.pushPayout,pushDraw:m.pushDraw,kezuri:m.kezuri,kachi:m.kachi,genkin:m.genkin,rph:m.rph,startedAt:0,breakMin:""}; save(); render(); } }
      else if(a==="btgadd"){ (m.segments=m.segments||[]).push({id:uid(),sb:"",ss:"",eb:"",es:"",rpStart:"",rpEnd:"",cash:""}); save(); render(); }
      else if(a==="btgdel"){ m.segments=(m.segments||[]).filter(x=>String(x.id)!==String(v)); save(); render(); }
      else if(a==="startnow"){ m.startedAt=Date.now(); save(); render(); }
      else if(a==="btpick"){ const x=(S.mdb||[]).find(z=>String(z.id)===String(v)); if(x){ m.name=x.name; save(); render(); } }
      else if(a==="btstore"){
        const x=(S.stores||[]).find(z=>String(z.id)===String(v));
        if(x){
          if((x.pachiEx||"").trim()!==""){ m.kachi=x.pachiEx; }
          if((x.pachiGenkin||"").trim()!==""){ m.genkin=x.pachiGenkin; }
          if((x.pachiPay||"").trim()!==""){ m.pushPayout=x.pachiPay; }
          if((x.pachiDraw||"").trim()!==""){ m.pushDraw=x.pachiDraw; }
          save(); render();
        }
      }
    };
  });
}</script>
<script>
/* ---------- セッション画面のバインド ---------- */
function bindSession(){
  const s = UI.draft;
  const fm = (id)=>s.machines.find(x=>String(x.id)===String(id));

  /* 入力(再描画なし・計算表示のみ更新) */
  document.querySelectorAll("[data-in]").forEach(el=>{
    const kind = el.dataset.in, v = el.dataset.v;
    el.oninput = ()=>{
      if(kind==="fee"){ s.fee=el.value; refreshSummary(); }
      else if(kind==="smemo"){ s.memo=el.value; }
      else if(kind==="exchange"){ s.exchange=el.value; refreshSlot(); }
      else if(kind==="pexchange"){ s.pExchange=el.value; refreshSlot(); }

      else if(kind==="myshare"){ s.myShare=el.value; refreshSlot(); }
      else if(kind==="xstore"||kind==="xitem"||kind==="xamount"){
        const x = s.expenses.find(e=>String(e.id)===String(v));
        if(!x) return;
        if(kind==="xstore") x.store=el.value;
        else if(kind==="xitem"){ x.item=el.value; delete x.label; }
        else x.amount=el.value;
        refreshSummary();
      }
      else if(kind==="mname"){
        const m=fm(v); if(!m) return;
        m.name=el.value;
        const sug=document.getElementById("msug-"+m.id);
        if(sug){
          const q=(m.name||"").trim();
          const hits=S.mdb.filter(x=>x.kind===m.kind&&(x.name||"").trim()&&x.name.includes(q)&&x.name.trim()!==q).slice(0,4);
          sug.innerHTML = hits.length?'<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:8px">'+
            hits.map(x=>'<button class="chip" data-a="msug" data-v="'+m.id+'|'+esc(x.name)+'">'+esc(x.name)+'</button>').join("")+'</div>':'';
          bindSessionActions();
        }
        if(m.kind==="pachi") refreshPanel(m);
      }
      else if(kind==="mmemo"){ const m=fm(v); if(m) m.memo=el.value; }
      else if(kind==="mstock"){
        const [mid,k]=v.split("|");
        const m=fm(mid); if(m){ m[k]=el.value; refreshSlot(); }
      }
      else if(kind==="mcash"){
        const [mid,cid,k]=v.split("|");
        const m=fm(mid); if(!m) return;
        const c=(m.cash||[]).find(x=>String(x.id)===String(cid)); if(c){ c[k]=el.value; refreshSlot(); }
      }
      else if(kind==="mborder"||kind==="mty"){
        const m=fm(v); if(!m) return;
        if(kind==="mborder") m.border=el.value; else m.ty=el.value;
        refreshPanel(m, true);
      }
      else if(kind==="gseg"){
        const [mid,gid,k]=v.split("|");
        const m=fm(mid); if(!m) return;
        const g=(m.segments||[]).find(x=>String(x.id)===String(gid)); if(!g) return;
        g[k]=el.value;
        const st=document.getElementById("gstat-"+g.id); if(st) st.textContent=segStat(g);
        const fo=document.getElementById("gform-"+g.id); if(fo) fo.textContent=segFormula(g);
        refreshPanel(m);
      }
    };
  });
  document.getElementById("s-date").oninput = e=>s.date=e.target.value;
  document.getElementById("s-store").oninput = e=>s.store=e.target.value;
  const ts0=document.getElementById("s-tstart"); if(ts0) ts0.oninput = e=>s.startAt=e.target.value;
  const te0=document.getElementById("s-tend"); if(te0) te0.oninput = e=>s.endAt=e.target.value;
  const pn = document.getElementById("s-pname");
  if(pn) pn.oninput = e=>s.partnerName=e.target.value;

  bindSessionActions();
}

function refreshSlot(){
  /* 貯玉方式は台収支・人合計・サマリー全てが連動するため、フォーカス保持で全再描画 */
  const f = document.activeElement;
  const fv = f && f.dataset && f.dataset.in
    ? {in:f.dataset.in, v:(f.dataset.v!==undefined?f.dataset.v:null)} : null;
  render();
  if(fv){
    const sel = fv.v!==null
      ? '[data-in="'+fv.in+'"][data-v="'+fv.v+'"]'
      : '[data-in="'+fv.in+'"]:not([data-v])';
    const nel = document.querySelector(sel);
    if(nel){ nel.focus(); /* number入力はカーソル末尾で問題ないため位置復元しない */ }
  }
}
function refreshSummary(){
  const el = document.getElementById("ssummary");
  if(el) el.innerHTML = sessionSummary(UI.draft);
}
function refreshPanel(m, keepInputs){
  const el = document.getElementById("mpanel-"+m.id);
  if(!el) return;
  if(keepInputs){
    /* 手入力欄フォーカス保持のため、乖離部分だけ作り直すのは煩雑なので全体更新+値復元 */
    const focused = document.activeElement;
    const fv = focused && focused.dataset ? {in:focused.dataset.in, v:focused.dataset.v, val:focused.value, ss:focused.selectionStart} : null;
    el.innerHTML = borderPanel(m);
    bindSessionActions(); rebindPanelInputs(m);
    if(fv && fv.in){
      const nel = el.querySelector('[data-in="'+fv.in+'"][data-v="'+fv.v+'"]');
      if(nel){ nel.value=fv.val; nel.focus(); try{nel.selectionStart=nel.selectionEnd=fv.ss;}catch(e){} }
    }
  } else {
    el.innerHTML = borderPanel(m);
    bindSessionActions(); rebindPanelInputs(m);
  }
}
function rebindPanelInputs(m){
  const el = document.getElementById("mpanel-"+m.id);
  if(!el) return;
  el.querySelectorAll("[data-in]").forEach(inp=>{
    inp.oninput = ()=>{
      if(inp.dataset.in==="mborder") m.border=inp.value;
      else if(inp.dataset.in==="mty") m.ty=inp.value;
      refreshPanel(m, true);
    };
  });
}

function bindSessionActions(){
  const s = UI.draft;
  document.querySelectorAll("[data-a]").forEach(el=>{
    el.onclick = ()=>{
      const a=el.dataset.a, v=el.dataset.v;
      if(a==="back"){ UI.screen="main"; UI.draft=null; render(); }
      else if(a==="mode"){ s.mode=v; render(); }
      else if(a==="pname"){ s.partnerName=v; render(); }
      else if(a==="sstore"){ s.store=v; render(); }
      else if(a==="lottery"){ s.lotteryOnly=!s.lotteryOnly; render(); }
      else if(a==="applystore"){
        const st=(S.stores||[]).find(x=>String(x.id)===String(v));
        if(st){
          if((st.slotEx||"").trim()!==""){ s.exchange=st.slotEx; S.rates.exchange=st.slotEx; }
          if((st.pachiEx||"").trim()!==""){ s.pExchange=st.pachiEx; S.rates.pExchange=st.pachiEx; }
          render();
        }
      }
      else if(a==="whotab"){ UI.whoTab=v; render(); }
      else if(a==="madd"){
        const nm = {id:uid(),kind:v,name:"",memo:"",who:"me",startStock:"",endStock:"",holdBalls:"",cash:[]};
        if(v==="pachi") nm.segments=[];
        s.machines.push(nm); render();
      }
      else if(a==="maddw"){
        const [k,who]=v.split("|");
        const nm = {id:uid(),kind:k,name:"",memo:"",who,startStock:"",endStock:"",holdBalls:"",cash:[]};
        if(k==="pachi") nm.segments=[];
        s.machines.push(nm); render();
      }
      else if(a==="mdel"){ if(confirm("この台を削除しますか?")){ s.machines=s.machines.filter(x=>String(x.id)!==String(v)); render(); } }
      else if(a==="msug"){
        const [mid,name]=v.split("|");
        const m=s.machines.find(x=>String(x.id)===String(mid));
        if(m){ m.name=name; render(); }
      }
      else if(a==="mcashadd"){
        const m=s.machines.find(x=>String(x.id)===String(v));
        if(m){ (m.cash=m.cash||[]).push({id:uid(),label:"",amount:""}); render(); }
      }
      else if(a==="mcashdel"){
        const [mid,cid]=v.split("|");
        const m=s.machines.find(x=>String(x.id)===String(mid));
        if(m){ m.cash=(m.cash||[]).filter(x=>String(x.id)!==String(cid)); render(); }
      }
      else if(a==="gadd"){
        const m=s.machines.find(x=>String(x.id)===String(v));
        if(m){ (m.segments=m.segments||[]).push({id:uid(),kind:"ball",sb:"",ss:"",eb:"",es:"",rpStart:"",rpEnd:""}); render(); }
      }
      else if(a==="gkind"){
        const [mid,gid]=v.split("|");
        const m=s.machines.find(x=>String(x.id)===String(mid));
        const g=m&&(m.segments||[]).find(x=>String(x.id)===String(gid));
        if(g){ g.kind = g.kind==="push"?"ball":"push"; render(); }
      }
      else if(a==="gdel"){
        const [mid,gid]=v.split("|");
        const m=s.machines.find(x=>String(x.id)===String(mid));
        if(m){ m.segments=(m.segments||[]).filter(x=>String(x.id)!==String(gid)); render(); }
      }
      else if(a==="xadd"){ s.expenses.push({id:uid(),store:"",item:"",amount:""}); render(); }
      else if(a==="xdel"){
        const x = s.expenses.find(e=>String(e.id)===String(v));
        if(x && x.fromData){
          if(!confirm("この経費は家計簿からの振替です。経費から外し、保存した時点で家計簿に記録を戻します。よろしいですか?")) return;
          (s._restore=s._restore||[]).push(x.fromData);
        }
        s.expenses=s.expenses.filter(e=>String(e.id)!==String(v)); render();
      }
      else if(a==="xfopen"){ UI.xferOpen=!UI.xferOpen; render(); }
      else if(a==="xfpick"){
        const e=(S.entries||[]).find(x=>String(x.id)===String(v));
        if(e){ s.expenses.push({id:uid(), store:e.store||"", item:(e.item||e.memo||e.category||"支出"), amount:String(num(e.amount)), fromEntry:e.id, fromData:Object.assign({},e)}); UI.xferOpen=false; render(); }
      }
      else if(a==="sdel"){
        if(!confirm("この稼働記録を削除しますか?(家計簿の連携分も消えます)")) return;
        S.entries = S.entries.filter(e=>e.id!=="slot-"+s.id);
        S.sessions = S.sessions.filter(x=>x.id!==s.id);
        save(); UI.screen="main"; UI.draft=null; render();
      }
      else if(a==="ssave") saveSession();
    };
  });
}

function saveSession(){
  const s = UI.draft;
  if(!s.date) return;
  const cleaned = Object.assign({}, s, {
    fee: String(num(s.fee))
  });
  const _rs = cleaned._restore||[]; delete cleaned._restore;
  delete cleaned.own; delete cleaned.partner; delete cleaned.results;
  if(UI.isNewSess) S.sessions.push(cleaned);
  else S.sessions = S.sessions.map(x=>x.id===s.id?cleaned:x);
  /* レート記憶 */
  if(num(cleaned.exchange)>0) S.rates.exchange = cleaned.exchange;
  if(num(cleaned.pExchange)>0) S.rates.pExchange = cleaned.pExchange;
  if(num(cleaned.pushPayout)>0) S.rates.pushPayout = cleaned.pushPayout;
  if(num(cleaned.pushDraw)>0) S.rates.pushDraw = cleaned.pushDraw;
  /* 家計簿連携 */
  const linkId = "slot-"+s.id;
  const fin = finalOwn(cleaned);
  const isDai = cleaned.mode==="dai";
  S.entries = S.entries.filter(e=>e.id!==linkId);
  if(fin!==0){
    S.entries.push({id:linkId, date:cleaned.date,
      src: isDai ? "daida" : "slot",
      type: fin>0?"income":"expense",
      category: isDai ? "副業" : "遊技",
      amount: Math.abs(fin),
      memo: modeLabel(cleaned.mode)+(cleaned.store?" @"+cleaned.store:"")});
  }
  /* 家計簿からの振替: 選択元の記録をここで削除(保存とワンセット) */
  const _xf = new Set((cleaned.expenses||[]).map(x=>String(x.fromEntry)).filter(x=>x!=="undefined"&&x!=="null"));
  if(_xf.size) S.entries = S.entries.filter(e=>!_xf.has(String(e.id)));
  _rs.forEach(d=>{ if(d && !S.entries.some(e=>String(e.id)===String(d.id))) S.entries.push(d); });
  save(); UI.screen="main"; UI.draft=null; render();
  const _msgs=[]; if(_xf.size) _msgs.push("振替"+_xf.size+"件"); if(_rs.length) _msgs.push("家計簿へ"+_rs.length+"件戻し");
  if(_msgs.length) toast("保存しました("+_msgs.join(" / ")+")");
}
</script>

function bindBackup(){
  bindSyncBox();
  document.querySelectorAll("[data-a]").forEach(el=>{
    el.onclick = ()=>{
      const a=el.dataset.a;
      if(a==="back"){ UI.screen="main"; render(); }
      else if(a==="msgclose"){ UI.msg=""; renderKeepScroll(); }
      else if(a==="snaptoggle"){ UI.snapOpen=!UI.snapOpen; renderKeepScroll(); }
      else if(a==="csv"){ exportCsv(); }
      else if(a==="bexport"){
        dl(JSON.stringify(Object.assign({exportedAt:new Date().toISOString()},S), null, 1),
          "tally_backup_"+todayStr()+".json", "application/json");
        UI.msg = "書き出しました(記録"+S.entries.length+"件 / 稼働"+S.sessions.length+"件 / 機種"+S.mdb.length+"件)";
        render();
      }
      else if(a==="bcopy"){
        const txt = JSON.stringify(Object.assign({exportedAt:new Date().toISOString()},S));
        const ta = document.createElement("textarea");
        ta.value=txt; document.body.appendChild(ta); ta.select();
        let ok=false; try{ ok=document.execCommand("copy"); }catch(e){}
        document.body.removeChild(ta);
        if(!ok && navigator.clipboard) navigator.clipboard.writeText(txt).then(()=>{});
        UI.msg = "クリップボードにコピーしました。メモアプリ等に貼り付けて保存してください。";
        render();
      }
      else if(a==="bimport"){
        const txt = document.getElementById("b-import").value;
        try{
          const d = JSON.parse(txt);
          if(!Array.isArray(d.entries)||!Array.isArray(d.sessions)) throw new Error("形式不正");
          if(!confirm("現在のデータを完全に置き換えます。よろしいですか?\n(直前の状態は自動退避され、「自動スナップショット」から戻せます)")) return;
          takeSnap("復元前");
          applyData(d);   /* 全フィールドの復元+スキーマ移行を一括処理 */
          save();
          UI.msg = "復元しました(記録"+S.entries.length+"件 / 稼働"+S.sessions.length+"件 / 麻雀"+S.mjSessions.length+"件 / 機種"+S.mdb.length+"件)";
          render();
        }catch(e){
          UI.msg = "取り込めませんでした。JSON全体(先頭の{から末尾の}まで)を貼り付けているか確認してください。";
          render();
        }
      }
      else if(a==="snaprestore"){
        const sn = loadSnaps(); const s = sn[Number(el.dataset.v)];
        if(!s || !s.d) return;
        const d0 = new Date(s.ts);
        const dt = (d0.getMonth()+1)+"/"+d0.getDate()+" "+("0"+d0.getHours()).slice(-2)+":"+("0"+d0.getMinutes()).slice(-2);
        if(!confirm(dt+" 時点の状態に戻します。よろしいですか?\n(現在の状態は「復元前」として退避されます)")) return;
        takeSnap("復元前");
        applyData(s.d);
        save();
        UI.msg = "スナップショットから復元しました(記録"+S.entries.length+"件 / 稼働"+S.sessions.length+"件)";
        renderKeepScroll();
      }
      else if(a==="btest"){
        const log=[];
        const chk=(name,got,want)=>log.push((String(got)===String(want)?"✓ ":"✗ ")+name+": "+got+(String(got)===String(want)?"":" (期待値 "+want+")"));
        try{ localStorage.setItem("diag:test", JSON.stringify({t:Date.now()})); log.push("✓ 保存領域の書込: OK"); }
        catch(e){ log.push("✗ 保存領域の書込: "+e.message); }
        try{ const r=localStorage.getItem("diag:test"); log.push(r?"✓ 保存領域の読出: OK":"✗ 保存領域の読出: 値なし"); }
        catch(e){ log.push("✗ 保存領域の読出: "+e.message); }
        try{
          const m=localStorage.getItem(KEY);

/* ============================================================
   クラウド同期(Supabase)
   ローカルファースト: localStorageが作業コピー。
   起動時とオンライン復帰時に、タイムスタンプで新しい方を採用(案ア)。
   ============================================================ */
const SB_URL = "https://uxvihnyrchaczwghykot.supabase.co";
const SB_KEY = "sb_publishable_qjSW1MlyG6fr-GSMj9mGTQ_9c73lmsx";
let sb = null;            // Supabaseクライアント
let sbSession = null;     // ログインセッション
let syncState = "off";    // off | ready | syncing | error | offline | nokey
let pushTimer = null;

function initSb(){
  if(sb) return sb;
  if(window.supabase){
    try{ sb = window.supabase.createClient(SB_URL, SB_KEY, {auth:{persistSession:true, autoRefreshToken:true}}); }
    catch(e){ sb = null; }
  }
  return sb;
}
function setSync(s){ syncState = s; updateSyncUi(); }
function syncLabel(){
  return ({off:"未ログイン", ready:"同期済み", syncing:"同期中…", error:"同期エラー", offline:"オフライン", nokey:"読込中"})[syncState] || "";
}
function updateSyncUi(){
  const b = document.getElementById("syncbadge");
  if(b){ b.className = "syncbtn " + syncState; }
  if(UI.screen==="backup"){
    const box = document.getElementById("syncbox");
    if(box){ box.innerHTML = syncBoxHtml(); bindSyncBox(); }
  }
}

async function pushCloud(){
  if(!sb || !sbSession) return;
  try{
    setSync("syncing");
    const { error } = await sb.from("app_data").upsert({
      user_id: sbSession.user.id,
      data: S,
      updated_at: new Date().toISOString()
    }, { onConflict: "user_id" });
    if(error) throw error;
    setSync("ready");
  }catch(e){ setSync("error"); }
}
function schedulePush(){
  if(!sb || !sbSession) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(pushCloud, 1200);
}
async function fetchCloud(){
  if(!sb || !sbSession) return null;
  const { data, error } = await sb.from("app_data")
    .select("data").eq("user_id", sbSession.user.id).maybeSingle();
  if(error) throw error;
  return data ? data.data : null;
}
async function cloudSync(){
  if(!sb || !sbSession) return;
  try{
    setSync("syncing");
    const cloud = await fetchCloud();
    const localTs = S.updatedAt || 0;
    const cloudTs = cloud ? (cloud.updatedAt || 0) : -1;
    if(cloud && cloudTs > localTs){
      takeSnap("同期前");       // 上書き前にローカルを退避
      applyData(cloud);         // クラウドが新しい→採用
      fixedDedupe();            // 受信状態に分身がいたらここで掃除
      saveLocal();
      render();
      toast("クラウドから同期しました");
      setSync("ready");
    }else if(localTs > cloudTs){
      await pushCloud();        // ローカルが新しい→送信
      toast("クラウドへ同期しました");
    }else{
      setSync("ready");
    }
  }catch(e){ setSync("error"); }
}

async function authSignIn(email, pw){
  if(!initSb()) return {error:"接続できません(オフラインの可能性があります)"};
  const { data, error } = await sb.auth.signInWithPassword({email, password:pw});
  if(error) return {error: error.message};
  sbSession = data.session; return {ok:true};
}
async function authSignUp(email, pw){
  if(!initSb()) return {error:"接続できません(オフラインの可能性があります)"};
  const { data, error } = await sb.auth.signUp({email, password:pw});
  if(error) return {error: error.message};
  sbSession = data.session; return {ok:true};
}
async function authSignOut(){
  if(sb){ try{ await sb.auth.signOut(); }catch(e){} }
  sbSession = null; setSync("off");
}

function whenSbReady(cb){
  if(window.supabase) return cb();
  let n=0;
  const iv=setInterval(()=>{
    if(window.supabase){ clearInterval(iv); cb(); }
    else if(++n>40){ clearInterval(iv); setSync(navigator.onLine?"off":"offline"); }
  },150);
}
async function initCloud(){
  if(!initSb()){ setSync(navigator.onLine?"off":"offline"); return; }
  try{
    const { data } = await sb.auth.getSession();
    sbSession = (data && data.session) || null;
    if(sbSession){ await cloudSync(); }
    else setSync("off");
  }catch(e){ setSync("error"); }
}
window.addEventListener("online", ()=>{ if(sbSession) cloudSync(); });
window.addEventListener("offline", ()=>{ if(!sbSession) setSync("offline"); });

    '<div class="row" style="gap:8px">'+
    '<button class="btn primary" style="flex:1;font-weight:700;padding:11px 0" data-sa="login">ログイン</button>'+
    '<button class="btn tealb" style="flex:1;font-weight:700;padding:11px 0" data-sa="signup">新規登録</button></div>'+
    (UI.syncMsg?'<div class="'+(UI.syncErr?"red":"teal")+'" style="font-size:11px;margin-top:10px;line-height:1.6">'+esc(UI.syncMsg)+'</div>':'')+'</div>';

function bindSyncBox(){
  document.querySelectorAll("[data-sa]").forEach(el=>{
    el.onclick = async ()=>{
      const a = el.dataset.sa;
      if(a==="logout"){ await authSignOut(); UI.syncMsg=""; render(); }
      else if(a==="syncnow"){ await cloudSync(); }
      else if(a==="login" || a==="signup"){
        const email = (document.getElementById("sync-email").value||"").trim();
        const pw = document.getElementById("sync-pw").value||"";
        if(!email || pw.length<6){ UI.syncErr=true; UI.syncMsg="メールアドレスと6文字以上のパスワードを入力してください。"; updateSyncUi(); return; }
        UI.syncErr=false; UI.syncMsg = (a==="login"?"ログイン中…":"登録中…"); updateSyncUi();
        const r = a==="login" ? await authSignIn(email, pw) : await authSignUp(email, pw);
        if(r.error){ UI.syncErr=true; UI.syncMsg = r.error; updateSyncUi(); return; }
        UI.syncErr=false; UI.syncMsg=""; 
        await cloudSync();
        render();
      }
    };
  });
}

/* ---------- アプリ更新チェック ---------- */
let updateChecking = false, lastUpdateCheck = 0;
async function checkForUpdate(manual){
  const now = Date.now();
  if(!manual && now - lastUpdateCheck < 60000) return;   /* 自動は60秒throttle。手動は常に実行 */
  if(updateChecking) return;
  updateChecking = true; lastUpdateCheck = now;
  try{
    if("serviceWorker" in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg){ try{ await reg.update(); }catch(e){} }
    }
    const res = await fetch("./index.html?_=" + now, { cache:"no-store" });
    if(!res.ok) throw new Error("fetch " + res.status);
    const txt = await res.text();
    const mt = txt.match(/APP_VERSION\s*=\s*"([\d.]+)"/);
    const latest = mt ? mt[1] : null;
    if(latest && latest !== APP_VERSION) showUpdateBar(latest, manual);
    else if(manual) toast("最新です(" + APP_VERSION + ")");
  }catch(e){
    if(manual) toast("確認できませんでした(オフライン?)");
  }finally{
    updateChecking = false;
  }
}
function showUpdateBar(latest, manual){
  /* 手動は即確認ダイアログ。自動はバー通知のみ(入力中に勝手にリロードしない) */
  if(manual){
    if(confirm("新しいバージョン " + latest + " があります。\n今すぐ再読み込みしますか?(現在 " + APP_VERSION + ")")) reloadForUpdate();
    return;
  }
  if(document.getElementById("updatebar")) return;
  const bar = document.createElement("div");
  bar.id = "updatebar";
  bar.innerHTML = '<span>新バージョン ' + esc(latest) + ' が利用できます</span>'+
    '<button id="updatebar-btn">再読み込み</button>'+
    '<button id="updatebar-x" aria-label="閉じる">×</button>';
  document.body.appendChild(bar);
  document.getElementById("updatebar-btn").onclick = reloadForUpdate;
  document.getElementById("updatebar-x").onclick = ()=>bar.remove();
}
async function reloadForUpdate(){
  try{
    if("serviceWorker" in navigator){
      const reg = await navigator.serviceWorker.getRegistration();
      if(reg){ try{ await reg.update(); }catch(e){} }
    }
  }catch(e){}
  location.reload();
}
/* 起動時・復帰時の自動チェック */
setTimeout(()=>checkForUpdate(false), 1500);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="visible") checkForUpdate(false); });

setSync("nokey");
whenSbReady(initCloud);
